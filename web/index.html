<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YEP Youth Empowerment Project</title>
  <meta name="description" content="Youth Digital Empowerment and Virtual Exchange Platform for young people aged 18 to 35 in Uganda and East Africa.">
  <meta name="theme-color" content="#00184D">
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="img/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lexend-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><div class="loading" role="status"><span class="spin"></span><span class="sr-only">Loading YEP</span></div></div>
  <div id="toast" aria-live="polite"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="yepTrail" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F07A1A"/><stop offset="1" stop-color="#FEBA03"/></linearGradient>
  </defs></svg>
  <noscript><p style="padding:20px">YEP needs JavaScript turned on in your browser.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
